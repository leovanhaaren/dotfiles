[metadata]
name = "sesh"
description = "Session manager integrating tmux sessions, zoxide directories, and config paths"
requirements = ["sesh-picker", "bun"]

[source]
ansi = true
frecency = false
no_sort = true
output = "{strip_ansi|split:\t:0}"

[[source.command]]
name = "All"
run = "sesh-picker list all"

[[source.command]]
name = "Tmux"
run = "sesh-picker list tmux"

[[source.command]]
name = "Worktrunk"
run = "sesh-picker list worktrunk"

[[source.command]]
name = "Herdr"
run = "sesh-picker list herdr"

[[source.command]]
name = "Configs"
run = "sesh-picker list configs"

[[source.command]]
name = "Zoxide"
run = "sesh-picker list zoxide"

[[source.command]]
name = "Directories"
run = "sesh-picker list directories"

[preview]
command = "sesh-picker preview '{split:\t:1}'"

[keybindings]
enter = "actions:connect"
ctrl-d = ["actions:kill_session", "reload_source"]

[actions.connect]
description = "Connect to selected session"
command = "sesh-picker connect '{split:\t:1}' --apply"
mode = "execute"

[actions.kill_session]
description = "Kill selected tmux session (press Ctrl+r to reload)"
command = "sesh-picker kill '{split:\t:1}' --apply"
mode = "fork"
