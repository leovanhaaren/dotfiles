onboarding = false

[theme]
name = "catppuccin"

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
# Compact layout: tmux-style internal splitters, no outer frame, gaps, or scrollbars
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
hide_tab_bar_when_single_tab = true
sidebar_width = 22

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab", "agent"]]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace", "branch", "git_status"]]

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true

[terminal]
new_cwd = "~/Workspaces"

[worktrees]
directory = "~/Workspaces/worktrees"

[keys]
prefix = "ctrl+b"
goto = "prefix+g"
new_tab = "prefix+c"
close_tab = "prefix+ampersand"
next_tab = "prefix+n"
previous_tab = "prefix+p"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
split_horizontal = "prefix+minus"
split_vertical = "prefix+backslash"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
workspace_picker = "prefix+w"
focus_agent = "prefix+alt+1..9"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[[keys.command]]
key = "prefix+alt+l"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"